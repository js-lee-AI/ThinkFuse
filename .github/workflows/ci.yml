name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }}, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Example
        run: python example.py
      - name: Tests
        run: pytest -q

  install:
    name: clean install, used from outside the checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Non-editable install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Import away from the source tree
        working-directory: ${{ runner.temp }}
        run: python -c "import thinkfuse; print(thinkfuse.__version__)"
